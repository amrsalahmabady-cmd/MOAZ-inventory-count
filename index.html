<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جرد صيدلية معاذ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#18212b}
header{background:#0f766e;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 2px}
.sub{opacity:.9;font-size:13px}
.doctor-name{font-size:14px;font-weight:normal;opacity:.95;margin-top:2px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 12px #00000010}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
button,input{font:inherit;border-radius:11px;border:1px solid #d4dbe2;padding:12px}
button{cursor:pointer;border:0;background:#0f766e;color:white;font-weight:bold}
button.secondary{background:#e8eef2;color:#1d2a33}
button.danger{background:#b42318;color:white}
input{width:100%;background:white}
.big{font-size:20px}
label{display:block;font-size:13px;margin:6px 0;color:#52606d}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px;display:none}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1;min-width:110px;background:#f1f5f9;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}
.short{color:#b42318;font-weight:bold}
.over{color:#067647;font-weight:bold}
.notice{font-size:13px;color:#52606d;line-height:1.6}
.hidden{display:none}
.search-results{position:relative}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #d4dbe2;border-radius:11px;max-height:250px;overflow-y:auto;z-index:10;box-shadow:0 4px 12px #00000015}
.search-item{padding:10px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.search-item:hover{background:#f5f7fa}
.action-btn{padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px}

.alert-warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:8px 12px;border-radius:8px;font-weight:bold;margin-top:8px;display:inline-block}
.status-tag{background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;margin-bottom:10px;display:inline-block}
tr.highlight-row{background-color:#fef9c3 !important;transition:background-color 0.5s ease}
</style>
</head>
<body>

<header>
  <h1>🏥 جرد صيدلية معاذ</h1>
  <div class="doctor-name">د / إبراهيم حلمي</div>
  <div class="sub" style="margin-top: 4px;">باركود USB أو كاميرا الموبايل • البيانات محليًا على الجهاز</div>
</header>

<main>
<section class="card">
  <div id="saveStatus" class="status-tag">💾 جاهز - يتم حفظ البيانات تلقائياً</div>
  <div class="row">
    <div>
      <label>رفع ملف Excel البيانات</label>
      <input id="file" type="file" accept=".xlsx,.xls,.csv">
