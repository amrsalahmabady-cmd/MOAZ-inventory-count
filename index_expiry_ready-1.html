<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جرد صيدلية معاذ</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#18212b}
header{background:#0f766e;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 2px}
.sub{opacity:.9;font-size:13px}
.doctor-name{font-size:14px;font-weight:normal;opacity:.95;margin-top:2px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 12px #00000010}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
button,input{font:inherit;border-radius:11px;border:1px solid #d4dbe2;padding:12px}
button{cursor:pointer;border:0;background:#0f766e;color:white;font-weight:bold}
button.secondary{background:#e8eef2;color:#1d2a33}
button.danger{background:#b42318;color:white}
input{width:100%;background:white}
.big{font-size:20px}
label{display:block;font-size:13px;margin:6px 0;color:#52606d}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;margin-top:10px;display:none}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1;min-width:110px;background:#f1f5f9;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}
.short{color:#b42318;font-weight:bold}
.over{color:#067647;font-weight:bold}
.notice{font-size:13px;color:#52606d;line-height:1.6}
.hidden{display:none}
.search-results{position:relative}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #d4dbe2;border-radius:11px;max-height:250px;overflow-y:auto;z-index:10;box-shadow:0 4px 12px #00000015}
.search-item{padding:10px;cursor:pointer;border-bottom:1px solid #f0f0f0}
.search-item:hover{background:#f5f7fa}
.action-btn{padding:4px 8px;border-radius:6px;font-size:12px;margin-left:4px}

.alert-warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:8px 12px;border-radius:8px;font-weight:bold;margin-top:8px;display:inline-block}
.status-tag{background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;margin-bottom:10px;display:inline-block}
tr.highlight-row{background-color:#fef9c3 !important;transition:background-color 0.5s ease}
</style>
</head>
<body>

<header>
  <h1>🏥 جرد صيدلية معاذ</h1>
  <div class="doctor-name">د / إبراهيم حلمي</div>
  <div class="sub" style="margin-top: 4px;">باركود USB أو كاميرا الموبايل • البيانات محليًا على الجهاز</div>
</header>

<main>
<section class="card">
  <div id="saveStatus" class="status-tag">💾 جاهز - يتم حفظ البيانات تلقائياً</div>
  <div class="row">
    <div>
      <label>رفع ملف Excel البيانات</label>
      <input id="file" type="file" accept=".xlsx,.xls,.csv">
    </div>
    <div class="search-results">
      <label>بحث يدوي مرن (Fuzzy Search)</label>
      <input id="search" placeholder="اكتب اسم المنتج، الباركود، أو Ref...">
      <div id="dropdown" class="search-dropdown hidden"></div>
    </div>
  </div>
</section>

<section class="card">
  <div class="row">
    <button id="cameraBtn">📷 تشغيل الكاميرا الخلفية</button>
    <button class="secondary" id="stopBtn">إيقاف الكاميرا</button>
  </div>
  <div id="reader"></div>
  <label style="margin-top:12px;">الباركود (جهاز Scanner USB أو إدخال يدوي)</label>
  <input id="barcode" class="big" autofocus inputmode="numeric" placeholder="اعمل Scan بالماسح هنا">
</section>

<section class="card">
  <h3>الصنف المحدد</h3>
  <div id="productInfo" class="notice">قم بمسح الباركود أو ابحث عن الصنف لبدء الجرد.</div>
  <div id="countArea" class="hidden">
    <label>الكمية الفعلية</label>
    <input id="actual" class="big" type="number" min="0" step="1" placeholder="مثال: 12">
    <div class="row" style="margin-top:8px">
      <button id="addBtn">✅ حفظ الجرد للصنف</button>
      <button class="secondary" id="plusBtn">+1 زيادة</button>
    </div>
  </div>
</section>

<section class="card">
  <div class="stat">
    <div>تم جرده<b id="done">0</b></div>
    <div>العجز<b id="shortage">0</b></div>
    <div>الزيادة<b id="over">0</b></div>
    <div>إجمالي الأصناف<b id="total">0</b></div>
  </div>
</section>

<section class="card">
  <div class="row">
    <button id="exportBtn">📥 تصدير ملف Excel للنتيجة</button>
    <button class="secondary" id="downloadOldBtn">📄 تنزيل ملف Excel الأصلي</button>
    <button class="danger" id="clearBtn">🗑️ مسح وإعادة بدء جرد جديد</button>
  </div>
  <div style="overflow:auto;margin-top:12px">
    <table>
      <thead>
        <tr>
          <th>الباركود</th>
          <th>الصنف</th>
          <th>السيستم</th>
          <th>الفعلي</th>
          <th>الفرق</th>
          <th>خيارات</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>
</main>

function normalizeBarcode(value){return String(value ?? '').trim().replace(/\\.0$/,'');}
function sameBarcode(a,b){const x=normalizeBarcode(a),y=normalizeBarcode(b);return x===y||x.replace(/^0+/,'')===y.replace(/^0+/,'');}
function getExpiryDates(barcode){const key=Object.keys(EXPIRY_DATA.dates).find(k=>sameBarcode(k,barcode));return key?EXPIRY_DATA.dates[key]:[];}
function getExpiryName(barcode){const key=Object.keys(EXPIRY_DATA.names).find(k=>sameBarcode(k,barcode));return key?EXPIRY_DATA.names[key]:'';}
function findProductByBarcode(barcode){return database.find(p=>sameBarcode(p['Product Barcode'] ?? p['Barcode'] ?? p['barcode'],barcode));}
function showScannedBarcode(barcode){
 let prod=findProductByBarcode(barcode);
 if(!prod && getExpiryDates(barcode).length) prod={'Product Barcode':normalizeBarcode(barcode),'Product Name':getExpiryName(barcode)||'صنف من ملف الصلاحية','Product Ref':'','QoH':0};
 if(prod) selectProduct(prod); else alert('الباركود غير موجود في ملف البيانات أو ملف الصلاحية: '+barcode);
}


// تحميل البيانات المحفوظة سابقاً فور فتح التطبيق
window.addEventListener('DOMContentLoaded', () => {
  const savedDatabase = localStorage.getItem('pharmacy_database');
  const savedInventory = localStorage.getItem('pharmacy_inventory');

  if (savedDatabase) {
    database = JSON.parse(savedDatabase);
    initFuse();
  }

  if (savedInventory) {
    inventory = JSON.parse(savedInventory);
    renderTable();
  }
});

function saveDataToLocalStorage() {
  localStorage.setItem('pharmacy_database', JSON.stringify(database));
  localStorage.setItem('pharmacy_inventory', JSON.stringify(inventory));
}

function initFuse() {
  fuse = new Fuse(database, {
    keys: ['Product Name', 'Product Barcode', 'Product Ref'],
    threshold: 0.4,
    distance: 100
  });
}

function updateStats() {
  const keys = Object.keys(inventory);
  let done = keys.length;
  let shortage = 0;
  let over = 0;
  
  keys.forEach(k => {
    let diff = inventory[k].actual - inventory[k].system;
    if(diff < 0) shortage += Math.abs(diff);
    if(diff > 0) over += diff;
  });

  document.getElementById('done').innerText = done;
  document.getElementById('shortage').innerText = shortage;
  document.getElementById('over').innerText = over;
  document.getElementById('total').innerText = database.length;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  Object.keys(inventory).forEach(barcode => {
    const item = inventory[barcode];
    const diff = item.actual - item.system;
    const tr = document.createElement('tr');
    tr.id = `row-${barcode}`;
    tr.innerHTML = `
      <td>${barcode}</td>
      <td>${item.name}</td>
      <td>${item.system}</td>
      <td>${item.actual}</td>
      <td class="${diff < 0 ? 'short' : (diff > 0 ? 'over' : '')}">${diff}</td>
      <td>
        <button class="action-btn secondary" onclick="editItem('${barcode}')">✏️ تعديل</button>
        <button class="action-btn danger" onclick="deleteItem('${barcode}')">🗑️ مسح</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  updateStats();
}

function selectProduct(product) {
  selectedProduct = product;
  const barcode = product['Product Barcode'];
  const refInfo = product['Product Ref'] ? ` | Ref: ${product['Product Ref']}` : '';
  const isAlreadyScanned = inventory.hasOwnProperty(barcode);
  
  let warningHTML = '';
  if (isAlreadyScanned) {
    warningHTML = `<br><div class="alert-warning">⚠️ تم جرده سابقاً (الكمية الحالية: ${inventory[barcode].actual})</div>`;
  }

  const expiryDates = getExpiryDates(barcode);
  const expiryHTML = expiryDates.length ? `<br><div class="status-tag" style="margin-top:8px">📅 تاريخ الصلاحية: <b>${expiryDates.join(' ، ')}</b></div>` : `<br><div class="alert-warning">⚠️ لا يوجد تاريخ صلاحية مسجل لهذا الباركود في ملف الصلاحية</div>`;
  document.getElementById('productInfo').innerHTML = `<b>${product['Product Name']}</b><br>الباركود: ${barcode}${refInfo} | الكمية بالسيستم: ${product['QoH'] || 0}${expiryHTML}${warningHTML}`;
  document.getElementById('countArea').classList.remove('hidden');
  
  const actualInput = document.getElementById('actual');
  actualInput.value = isAlreadyScanned ? inventory[barcode].actual : (product['QoH'] || 0);
  document.getElementById('dropdown').classList.add('hidden');
  actualInput.focus();
  actualInput.select();

  if (isAlreadyScanned) {
    const row = document.getElementById(`row-${barcode}`);
    if (row) {
      document.querySelectorAll('tr').forEach(r => r.classList.remove('highlight-row'));
      row.classList.add('highlight-row');
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

document.getElementById('file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const bstr = evt.target.result;
    const wb = XLSX.read(bstr, { type: 'binary' });
    const wsname = wb.SheetNames[0];
    database = XLSX.utils.sheet_to_json(wb.Sheets[wsname]);
    database = database.map(item => item['Product Barcode'] == null && item['Barcode'] != null ? {...item, 'Product Barcode':item['Barcode'], 'Product Name':item['Product Name'] || getExpiryName(item['Barcode']) || 'صنف', 'Product Ref':item['Product Ref'] || '', 'QoH':item['QoH'] || 0} : item);
    initFuse();
    saveDataToLocalStorage();
    updateStats();
    alert('تم تحميل البيانات بنجاح! عدد الأصناف: ' + database.length);
  };
  reader.readAsBinaryString(file);
});

document.getElementById('search').addEventListener('input', (e) => {
  const val = e.target.value.trim();
  const dropdown = document.getElementById('dropdown');
  if(!val || !fuse) {
    dropdown.classList.add('hidden');
    return;
  }

  const exactRefMatches = database.filter(item => 
    item['Product Ref'] && String(item['Product Ref']).toLowerCase().includes(val.toLowerCase())
  );

  let finalResults = [];

  if (exactRefMatches.length > 0) {
    finalResults = exactRefMatches;
  } else {
    const fuseResults = fuse.search(val);
    finalResults = fuseResults.map(res => res.item);
  }

  dropdown.innerHTML = '';
  if(finalResults.length > 0) {
    dropdown.classList.remove('hidden');
    finalResults.slice(0, 30).forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-item';
      const refText = item['Product Ref'] ? ` | Ref: ${item['Product Ref']}` : '';
      div.innerText = `${item['Product Name']} (${item['Product Barcode']})${refText}`;
      div.onclick = () => selectProduct(item);
      dropdown.appendChild(div);
    });
  } else {
    dropdown.classList.add('hidden');
  }
});

document.getElementById('barcode').addEventListener('change', (e) => {
  const code = e.target.value.trim();
  showScannedBarcode(code);
  e.target.value = '';
});

document.getElementById('addBtn').onclick = () => {
  if(!selectedProduct) return;
  const actualVal = parseFloat(document.getElementById('actual').value) || 0;
  inventory[selectedProduct['Product Barcode']] = {
    name: selectedProduct['Product Name'],
    ref: selectedProduct['Product Ref'] || '',
    system: selectedProduct['QoH'] || 0,
    actual: actualVal
  };
  renderTable();
  saveDataToLocalStorage();
  document.getElementById('countArea').classList.add('hidden');
  document.getElementById('productInfo').innerText = 'تم حفظ الجرد بنجاح!';
};

document.getElementById('plusBtn').onclick = () => {
  const input = document.getElementById('actual');
  input.value = (parseFloat(input.value) || 0) + 1;
};

window.deleteItem = function(barcode) {
  if(confirm('هل أنت تأكد من مسح هذا الصنف؟')) {
    delete inventory[barcode];
    renderTable();
    saveDataToLocalStorage();
  }
};

window.editItem = function(barcode) {
  const prod = findProductByBarcode(barcode);
  if(prod) selectProduct(prod);
};

document.getElementById('cameraBtn').onclick = () => {
  const readerEl = document.getElementById('reader');
  readerEl.style.display = 'block';
  
  if(!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader");
  }

  const config = { fps: 10, qrbox: { width: 250, height: 150 } };
  
  html5QrCode.start(
    { facingMode: "environment" }, 
    config, 
    (decodedText) => {
      showScannedBarcode(decodedText);
    },
    (errorMessage) => {}
  ).catch(err => {
    alert("تعذر الوصول للكاميرا: " + err);
  });
};

document.getElementById('stopBtn').onclick = () => {
  if(html5QrCode) {
    html5QrCode.stop().then(() => {
      document.getElementById('reader').style.display = 'none';
    }).catch(err => console.log(err));
  }
};

document.getElementById('exportBtn').onclick = () => {
  const data = Object.keys(inventory).map(barcode => {
    const prod = findProductByBarcode(barcode);
    
    // البحث عن السعر داخل حقل sales price بجميع أشكاله
    let itemPrice = 0;
    if (prod) {
      itemPrice = prod['sales price'] ?? prod['Sales Price'] ?? prod['Sales price'] ?? prod['SALES PRICE'] ?? 0;
    }

    return {
      'الباركود': barcode,
      'Product Ref': inventory[barcode].ref,
      'اسم الصنف': inventory[barcode].name,
      'السعر': itemPrice,
      'كمية السيستم': inventory[barcode].system,
      'الكمية الفعلية': inventory[barcode].actual,
      'الفرق': inventory[barcode].actual - inventory[barcode].system
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "نتائج الجرد");
  XLSX.writeFile(wb, "تقرير_الجرد.xlsx");
};

document.getElementById('downloadOldBtn').onclick = () => {
  if (database.length === 0) {
    alert('لم يتم رفع ملف بيانات أصلي بعد!');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(database);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "البيانات الأصلية");
  XLSX.writeFile(wb, "بيانات_السيستم_الأصلية.xlsx");
};

document.getElementById('clearBtn').onclick = () => {
  if(confirm('هل تريد مسح جميع بيانات الجرد والبدء من جديد؟')) {
    inventory = {};
    localStorage.removeItem('pharmacy_inventory');
    renderTable();
  }
};
</script>
</body>
</html>
